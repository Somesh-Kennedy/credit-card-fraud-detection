# pyproject.toml — makes `src/fraud` an installable Python package.
#
# Running `pip install -e .` once lets every entry point (CLI, tests, notebook,
# Streamlit app) simply `import fraud` — no sys.path hacks. "-e" (editable) means
# code changes are picked up immediately without reinstalling.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud"
version = "1.0.0"
description = "End-to-end credit card fraud detection: EDA, 30 engineered features, SMOTE, LightGBM, explainability and a Streamlit dashboard."
requires-python = ">=3.10"
# Keep in sync with requirements.txt (that file is what most people install from).
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "streamlit>=1.50",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "nbformat", "nbconvert", "ipykernel"]

# Short console commands created on install:  `fraud-train`, `fraud-predict`.
[project.scripts]
fraud-train = "fraud.train:main"
fraud-predict = "fraud.predict:main"

# "src layout": the importable code lives in src/, which prevents accidentally
# importing the un-installed local folder instead of the installed package.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
